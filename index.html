<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amira❤️</title>
<style>
  :root { --red: #e0263f; --deep: #6b0a18; --black: #030000; --text: #fff0f2; --rose: #ffb3c1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--black); color: var(--text);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
  }

  /* ---------- الصفحات ---------- */
  .page {
    position: fixed; inset: 0; z-index: 1; overflow: hidden; background: var(--black);
    transform: translateY(100%); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform 1.1s cubic-bezier(.7,0,.2,1), opacity 1s ease, visibility 0s linear 1.1s;
  }
  .page.above { transform: translateY(-100%); }
  .page.active {
    transform: none; opacity: 1; visibility: visible; pointer-events: auto; z-index: 2;
    transition: transform 1.1s cubic-bezier(.7,0,.2,1), opacity 1s ease, visibility 0s;
  }
  .page.out-up {
    transform: translateY(-35%); opacity: 0; visibility: visible;
    transition: transform 1.1s cubic-bezier(.7,0,.2,1), opacity 1s ease;
  }
  .page.out-down {
    transform: translateY(100%); visibility: visible;
    transition: transform 1.1s cubic-bezier(.7,0,.2,1), opacity 1s ease;
  }
  /* الأزرار القديمة للنقل بالضغط: اتشالت عشان التنقل بقى بالنزول */
  #nextBtn, .next-page, button[data-go="p4"] { display: none !important; }
  #curtain {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, #6b0a18 0%, #000 70%);
    transition: opacity .7s ease;
  }
  #curtain.on { opacity: 1; }

  .glow-bg {
    position: absolute; inset: -20%; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(107,10,24,.55), transparent 60%);
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .6; } 50% { opacity: 1; } }

  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.95) 100%);
  }

  .btn {
    display: inline-block; text-decoration: none; cursor: pointer; font-family: inherit;
    color: var(--rose); background: rgba(0,0,0,.5); border: 1px solid rgba(224,38,63,.5);
    padding: 9px 18px; border-radius: 40px; font-size: 14px; transition: background .3s;
  }
  .btn:hover { background: rgba(224,38,63,.2); }

  .float-heart {
    position: absolute; bottom: -30px; z-index: 1; pointer-events: none; color: var(--red);
    animation: rise linear forwards; opacity: .45;
  }
  @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

  /* ================= الصفحة 1 ================= */
  #p1 canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #p1 .startBtn {
    position: absolute; left: 50%; bottom: 16vh; transform: translateX(-50%); z-index: 8;
    padding: 14px 46px; background: transparent; color: var(--rose);
    border: 1px solid rgba(224,38,63,.7); border-radius: 40px; letter-spacing: 3px; font-size: 16px;
    cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 2s, background .4s;
    box-shadow: 0 0 25px rgba(224,38,63,.25);
  }
  #p1 .startBtn.show { opacity: 1; pointer-events: auto; }
  #p1 .startBtn:hover { background: rgba(224,38,63,.15); }
  #p1 .ui {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 40px 20px 110px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 3s ease;
  }
  #p1 .ui.show { opacity: 1; }
  .badge {
    padding: 7px 22px; border: 1px solid rgba(255,179,193,.45); color: var(--rose);
    font-size: 15px; letter-spacing: 2px; background: rgba(0,0,0,.4); border-radius: 30px; margin-bottom: 18px;
  }
  .name {
    font-family: "Segoe UI", Georgia, serif; font-style: italic;
    font-size: clamp(54px, 12vw, 116px); font-weight: 300; letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 35px rgba(224,38,63,.55); animation: softGlow 6s ease-in-out infinite;
  }
  @keyframes softGlow {
    0%,100% { text-shadow: 0 0 25px rgba(224,38,63,.4); }
    50%     { text-shadow: 0 0 50px rgba(224,38,63,.8); }
  }
  .msg {
    margin-top: 20px; max-width: 640px; min-height: 100px;
    font-size: clamp(18px, 3vw, 24px); line-height: 2.1;
    background: rgba(12,0,4,.55); border: 1px solid rgba(224,38,63,.25);
    border-radius: 24px; padding: 20px 28px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.8);
  }
  .typed::after { content: "|"; color: var(--rose); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .counter { margin-top: 18px; font-size: 16px; color: var(--rose); letter-spacing: 1px; }
  .counter b { font-size: 36px; color: var(--red); display: inline-block; min-width: 60px; font-weight: 600; }

  #p1 .player {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: center; gap: 12px; padding: 8px 18px;
    background: rgba(0,0,0,.6); border: 1px solid rgba(224,38,63,.35); border-radius: 40px;
    backdrop-filter: blur(10px); opacity: 0; transition: opacity 2s;
  }
  #p1 .player.show { opacity: 1; }
  #playBtn1 {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--red); color: #fff; font-size: 14px;
  }
  #songTitle { font-size: 14px; color: var(--rose); white-space: nowrap; }
  #p1 .nextBtn {
    position: absolute; right: 22px; bottom: 22px; z-index: 7;
    opacity: 0; pointer-events: none; transition: opacity 1.5s, background .3s;
  }
  #p1 .nextBtn.show { opacity: 1; pointer-events: auto; }

  /* ================= الصفحة 2: الكولاج ================= */
  #p2 .header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
  }
  #p2 .header h1 {
    font-family: "Segoe UI", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 22px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 18px rgba(224,38,63,.6);
  }
  #collage {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
    padding-top: 80px;
  }
  #collage::-webkit-scrollbar { display: none; }
  #canvas { position: relative; width: 100%; }

  .tile {
    position: absolute; cursor: pointer; border-radius: 6px;
    background: linear-gradient(160deg, #2a0209, #0a0000);
    border: 1px solid rgba(224,38,63,.35);
    box-shadow: 0 18px 40px rgba(0,0,0,.8);
    transform: rotate(var(--r));
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
    animation: tileIn 1s ease both;
    padding: 8px 8px 32px;
  }
  .tile:hover { transform: rotate(0deg) scale(1.05); box-shadow: 0 25px 60px rgba(224,38,63,.35); z-index: 5; }
  @keyframes tileIn {
    from { opacity: 0; transform: rotate(var(--r)) translateY(40px) scale(.9); }
    to   { opacity: 1; transform: rotate(var(--r)); }
  }
  .tile .img-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 3px; background: #1a0307; }
  .tile .img-wrap .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--rose); font-size: 14px; opacity: .6;
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .label {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 13px; color: var(--rose); font-style: italic;
  }

  #p2 .next-page {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 10;
  }

  /* ---------- اللايت بوكس ---------- */
  #lb { position: fixed; inset: 0; z-index: 40; display: none; }
  #lb.open { display: block; }
  #lb .lb-bg {
    position: absolute; inset: 0; background: rgba(0,0,0,.92); opacity: 0; transition: opacity .5s;
  }
  #lb.on .lb-bg { opacity: 1; }
  #lb .lb-card {
    position: fixed; perspective: 1400px; cursor: pointer; z-index: 2;
  }
  #lb .lb-inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .8s cubic-bezier(.4,.2,.2,1);
  }
  #lb .lb-card.flipped .lb-inner { transform: rotateY(180deg); }
  #lb .face {
    position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid rgba(224,38,63,.45); box-shadow: 0 30px 80px rgba(0,0,0,.9), 0 0 40px rgba(107,10,24,.5);
  }
  #lb .front { background: linear-gradient(160deg, #3a0510, #0a0000); }
  #lb .front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #lb .front .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 20px 18px;
    background: linear-gradient(to top, rgba(0,0,0,.9), transparent);
    font-size: 19px; font-style: italic; color: #fff;
  }
  #lb .back {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 50% 30%, #4a0612, #0a0000 75%);
    display: flex; align-items: center; justify-content: center; padding: 30px;
  }
  #lb .back p { font-size: clamp(16px, 2.4vw, 20px); line-height: 2.1; text-align: center; color: #fff5f6; }
  #lb .lb-hint {
    position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--rose); opacity: .6;
  }
  #lb .lb-controls {
    position: absolute; left: 0; right: 0; bottom: 4vh; display: flex; justify-content: center; gap: 12px; z-index: 3;
    opacity: 0; transition: opacity .4s;
  }
  #lb.on .lb-controls { opacity: 1; }
  #lb .close {
    position: absolute; top: 18px; right: 18px; z-index: 3; width: 42px; height: 42px; border-radius: 50%;
    font-size: 22px; line-height: 1; padding: 0; opacity: 0; transition: opacity .4s;
  }
  #lb.on .close { opacity: 1; }

  /* ================= الصفحة 3 ================= */
  #p3 .header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 20px 22px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #p3 main {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; gap: 18px;
  }
  #p3 .title {
    font-family: "Segoe UI", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: clamp(34px, 7vw, 60px); letter-spacing: 4px; color: #fff; text-shadow: 0 0 30px rgba(224,38,63,.6);
  }
  #p3 .sub { color: var(--rose); font-size: 16px; letter-spacing: 1px; }
  .orb-wrap {
    position: relative; width: min(74vw, 420px); aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; }
  #playBtn3 {
    position: relative; z-index: 2; width: 34%; aspect-ratio: 1; border-radius: 50%;
    border: 1px solid rgba(224,38,63,.7); cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff5a6e, #8b0a1c 70%); color: #fff;
    font-size: clamp(20px, 4vw, 32px); box-shadow: 0 0 40px rgba(224,38,63,.5);
    transition: transform .25s;
  }
  #playBtn3:hover { transform: scale(1.06); }
  .progress-wrap { width: min(80vw, 420px); }
  #bar {
    width: 100%; height: 6px; border-radius: 6px; background: rgba(255,179,193,.15);
    cursor: pointer; position: relative; overflow: hidden;
  }
  #fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0%;
    background: linear-gradient(90deg, #6b0a18, #e0263f, #ff5a6e); box-shadow: 0 0 12px rgba(224,38,63,.7);
  }
  .times { display: flex; justify-content: space-between; font-size: 13px; color: var(--rose); margin-top: 8px; direction: ltr; }
  .note { max-width: 480px; font-size: 16px; line-height: 2; color: #ffd6de; opacity: .85; }
  #tap {
    position: absolute; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(0,0,0,.85); cursor: pointer; color: var(--rose); font-size: 20px;
  }
  #tap.show { display: flex; }
  #tap .pulse { font-size: 54px; color: var(--red); animation: beat 1.4s infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  /* ================= الصفحة 4: الرسالة ================= */
  #p4 { overflow-y: auto; scrollbar-width: none; }
  #p4::-webkit-scrollbar { display: none; }
  #p4 .wrap {
    position: relative; z-index: 3; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 90px 22px 60px;
  }
  #p4 .paper {
    max-width: 620px; width: 100%; padding: 42px 36px; border-radius: 18px;
    background: linear-gradient(170deg, rgba(40,4,10,.88), rgba(10,0,0,.92));
    border: 1px solid rgba(224,38,63,.35);
    box-shadow: 0 30px 80px rgba(0,0,0,.9), 0 0 40px rgba(107,10,24,.4);
    animation: paperIn 1.2s ease both;
  }
  @keyframes paperIn { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }
  #p4 h2 {
    font-family: "Segoe UI", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: clamp(30px, 6vw, 44px); text-align: center; color: #fff;
    margin-bottom: 26px; text-shadow: 0 0 25px rgba(224,38,63,.55);
  }
  #p4 .ln {
    font-size: clamp(17px, 2.8vw, 21px); line-height: 2.1; color: #fff0f2; margin-bottom: 10px;
    opacity: 0; animation: lineIn 1s ease forwards;
  }
  #p4 .sign {
    margin-top: 26px; color: var(--rose); font-style: italic; text-align: left;
    opacity: 0; animation: lineIn 1.2s ease forwards;
  }
  @keyframes lineIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  /* ================= شاشة القفل بالتاريخ ================= */
  #startBtn { display: none !important; }
  #p1 .lock {
    position: absolute; inset: 0; z-index: 9; padding: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease, visibility 0s linear 0s;
  }
  #p1 .lock.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 1.2s ease, visibility 0s linear 1.2s; }
  .lock-card {
    width: min(92vw, 380px); padding: 34px 28px; text-align: center; border-radius: 22px;
    background: rgba(12,0,4,.75); border: 1px solid rgba(224,38,63,.4); backdrop-filter: blur(12px);
    box-shadow: 0 30px 80px rgba(0,0,0,.9), 0 0 40px rgba(107,10,24,.5);
    animation: paperIn 1.2s ease both;
  }
  .lock-card.shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  .lock-heart { font-size: 42px; animation: beat 1.6s infinite; }
  .lock-title {
    font-family: "Segoe UI", Georgia, serif; font-style: italic; font-size: 20px; color: #fff; margin: 10px 0 22px;
  }
  .lock-inputs { display: flex; gap: 10px; justify-content: center; direction: ltr; }
  .lock-inputs input {
    width: 30%; padding: 12px 6px; text-align: center; font-size: 18px; font-family: inherit;
    background: rgba(0,0,0,.5); border: 1px solid rgba(224,38,63,.4); border-radius: 12px;
    color: #fff; outline: none; -moz-appearance: textfield;
  }
  .lock-inputs input::-webkit-inner-spin-button, .lock-inputs input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .lock-inputs input:focus { border-color: var(--red); box-shadow: 0 0 14px rgba(224,38,63,.4); }
  #unlockBtn {
    margin-top: 22px; padding: 11px 40px; font-size: 15px; color: #fff; background: rgba(224,38,63,.25);
  }
  .lock-err { margin-top: 14px; min-height: 20px; font-size: 14px; color: #ff8a98; }
</style>
</head>
<body>

<div id="curtain"></div>

<!-- ================== الصفحة 1: القلب ================== -->
<section class="page active" id="p1">
  <div class="glow-bg"></div>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div class="lock" id="lock">
    <div class="lock-card" id="lockCard">
      <div class="lock-heart">❤️</div>
      <div class="lock-title">اكتبي التاريخ عشان تفتحي</div>
      <div class="lock-inputs">
        <input id="ld" type="number" placeholder="يوم" min="1" max="31" inputmode="numeric">
        <input id="lm" type="number" placeholder="شهر" min="1" max="12" inputmode="numeric">
        <input id="ly" type="number" placeholder="سنة" inputmode="numeric">
      </div>
      <button class="btn" id="unlockBtn">افتحي</button>
      <div class="lock-err" id="lockErr"></div>
    </div>
  </div>
  <button class="startBtn" id="startBtn">بداية</button>
  <div class="ui" id="ui">
    <div class="badge" id="badge"></div>
    <div class="name" id="name"></div>
    <div class="msg"><span class="typed" id="typed"></span></div>
    <div class="counter">بقالنا <b id="days">0</b> يوم مع بعض</div>
  </div>
  <div class="player" id="player">
    <button id="playBtn1">⏸</button>
    <span id="songTitle"></span>
  </div>
  <button class="btn nextBtn" id="nextBtn">الصفحة الجاية ←</button>
</section>

<!-- ================== الصفحة 2: الكولاج ================== -->
<section class="page" id="p2">
  <div class="header">
    <button class="btn" data-go="p1">→ البداية</button>
    <h1 id="p2title"></h1>
  </div>
  <div id="collage"><div id="canvas"></div></div>
  <button class="btn next-page" data-go="p3">الرسالة بصوتي ←</button>
</section>

<!-- اللايت بوكس -->
<div id="lb">
  <div class="lb-bg" id="lbBg"></div>
  <div class="lb-card" id="lbCard">
    <div class="lb-inner">
      <div class="face front">
        <img id="lbImg" alt="">
        <div class="cap" id="lbCap"></div>
      </div>
      <div class="face back"><p id="lbBack"></p></div>
    </div>
  </div>
  <button class="btn close" id="lbClose">✕</button>
  <div class="lb-controls">
    <button class="btn" id="lbPrev">→ السابقة</button>
    <button class="btn" id="lbNext">التالية ←</button>
  </div>
</div>

<!-- ================== الصفحة 3: الريكورد ================== -->
<section class="page" id="p3">
  <div class="glow-bg"></div>
  <div class="header">
    <button class="btn" data-go="p2">→ الصور</button>
    <button class="btn" data-go="p1">الرئيسية</button>
  </div>
  <button class="btn" data-go="p4" style="position:absolute;right:22px;bottom:22px;z-index:10">الصفحة الأخيرة ←</button>
  <div id="tap"><div class="pulse">❤️</div><div>اضغطي عشان تسمعي الرسالة</div></div>
  <main>
    <h1 class="title" id="voiceTitle"></h1>
    <div class="sub" id="voiceSub"></div>
    <div class="orb-wrap">
      <canvas id="viz"></canvas>
      <button id="playBtn3" aria-label="تشغيل">▶</button>
    </div>
    <div class="progress-wrap">
      <div id="bar"><div id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="note" id="voiceNote"></div>
  </main>
  <audio id="voice" preload="auto"></audio>
</section>

<!-- ================== الصفحة 4: الرسالة المكتوبة ================== -->
<section class="page" id="p4">
  <div class="glow-bg"></div>
  <div style="position:absolute;top:0;left:0;right:0;z-index:10;padding:18px 22px;display:flex;justify-content:space-between;">
    <button class="btn" data-go="p3">→ الرسالة بصوتي</button>
    <button class="btn" data-go="p1">الرئيسية</button>
  </div>
  <div class="wrap">
    <div class="paper">
      <h2 id="letterTitle"></h2>
      <div id="letterBody"></div>
    </div>
  </div>
</section>

<audio id="music" loop></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- الترتيب والتنقل ----------
  const ORDER = ["p1", "p2", "p3", "p4"];
  let current = "p1";
  let navLock = false;

  // dir = 1 يعني الصفحة الجاية من تحت، dir = -1 يعني الصفحة اللي فاتت من فوق
  function go(to, dir) {
    if (to === current) return;
    if (dir === undefined) dir = ORDER.indexOf(to) > ORDER.indexOf(current) ? 1 : -1;
    const from = $(current), next = $(to);

    next.className = "page";
    if (dir < 0) next.classList.add("above");
    void next.offsetWidth;                       // عشان المتصفح يسجّل الوضع الابتدائي

    from.classList.remove("active");
    from.classList.add(dir > 0 ? "out-up" : "out-down");
    next.classList.remove("above");
    next.classList.add("active");

    current = to;
    if (from.id === "p3") {                      // طلعتي من صفحة الريكورد
      voice.pause();
      $("music").play().catch(() => {});
      $("playBtn1").textContent = "⏸";
    }
    if (to === "p2") requestAnimationFrame(layoutCollage);
    if (to === "p3") { $("music").pause(); $("playBtn1").textContent = "▶"; onEnterVoice(); }
    if (to === "p4") startLetter();
    setTimeout(() => from.classList.remove("out-up", "out-down"), 1150);
  }

  function navigate(dir) {
    const j = ORDER.indexOf(current) + dir;
    if (j < 0 || j >= ORDER.length || navLock) return;
    navLock = true;
    go(ORDER[j], dir);
    setTimeout(() => navLock = false, 1500);
  }

  // الضغط على الزراير اللي فيها data-go (زراير الهيدر للرجوع)
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b && !navLock) {
      navLock = true;
      go(b.dataset.go);
      setTimeout(() => navLock = false, 1500);
    }
  });

  // الصفحة اللي فيها سكرول داخلي: لازم نخلص السكرول الأول قبل ما نغير الصفحة
  function scrollerOf() {
    return current === "p2" ? $("collage") : current === "p4" ? $("p4") : null;
  }
  function scrollState() {
    const sc = scrollerOf();
    if (!sc) return { down: false, up: false };
    return {
      down: sc.scrollTop + sc.clientHeight < sc.scrollHeight - 4,
      up: sc.scrollTop > 4
    };
  }

  // dy > 0 يعني نزول (سكرول لتحت أو سحب لفوق)
  function onGesture(dy, st) {
    if (Math.abs(dy) < 30 || navLock || lbIndex >= 0) return;
    if (current === "p1" && !unlocked) return;     // لازم تفتحي الموقع بالتاريخ الأول
    if (dy > 0 && st.down) return;                  // لسه في نص الصفحة
    if (dy < 0 && st.up) return;
    navigate(dy > 0 ? 1 : -1);
  }

  addEventListener("wheel", e => onGesture(e.deltaY, scrollState()), { passive: true });

  let touchY = null, touchState = null;
  addEventListener("touchstart", e => {
    touchY = e.touches[0].clientY;
    touchState = scrollState();
  }, { passive: true });
  addEventListener("touchend", e => {
    if (touchY === null) return;
    const dy = touchY - e.changedTouches[0].clientY;
    touchY = null;
    onGesture(dy, touchState);
  }, { passive: true });

  addEventListener("keydown", e => {
    if (lbIndex >= 0) return;   // الـ lightbox ليه الأسهم بتاعته
    if (["ArrowDown", "PageDown"].includes(e.key)) onGesture(100, scrollState());
    if (["ArrowUp", "PageUp"].includes(e.key)) onGesture(-100, scrollState());
  });

  // ================== الصفحة 1 ==================
  $("badge").textContent = CONFIG.badge;
  $("name").textContent = CONFIG.name;
  $("songTitle").textContent = CONFIG.songTitle;
  $("music").src = CONFIG.song;
  $("days").textContent = Math.max(0, Math.floor((Date.now() - new Date(CONFIG.startDate)) / 86400000));

  const renderer = new THREE.WebGLRenderer({ canvas: $("scene"), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030000, 0.01);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
  camera.position.set(0, 0, 70);
  function resize3D() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  resize3D();
  addEventListener("resize", resize3D);

  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = glowCanvas.height = 64;
  {
    const g = glowCanvas.getContext("2d");
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, "rgba(255,220,225,1)");
    grd.addColorStop(0.25, "rgba(224,38,63,.75)");
    grd.addColorStop(1, "rgba(107,10,24,0)");
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  }
  const glow = new THREE.CanvasTexture(glowCanvas);

  const N = CONFIG.particles;
  const shapes = { heart: new Float32Array(N * 3), name: new Float32Array(N * 3) };
  const shapeColors = { heart: new Float32Array(N * 3), name: new Float32Array(N * 3) };

  for (let i = 0; i < N; i++) {
    const t = Math.random() * Math.PI * 2;
    const k = Math.pow(Math.random(), 0.45);
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    shapes.heart[i * 3]     = x * 0.8 * k;
    shapes.heart[i * 3 + 1] = y * 0.8 * k + 1;
    shapes.heart[i * 3 + 2] = (Math.random() - 0.5) * 10 * k;
  }

  (function buildNameShape() {
    const c = document.createElement("canvas");
    c.width = 900; c.height = 260;
    const g = c.getContext("2d");
    g.fillStyle = "#fff";
    g.font = "italic 300 150px 'Segoe UI', Georgia, serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(CONFIG.name, 450, 130);
    const data = g.getImageData(0, 0, c.width, c.height).data;
    const pts = [];
    for (let y = 0; y < c.height; y += 2)
      for (let x = 0; x < c.width; x += 2)
        if (data[(y * c.width + x) * 4 + 3] > 128) pts.push([x, y]);
    for (let i = 0; i < N; i++) {
      const j = i * 3;
      if (pts.length) {
        const [px, py] = pts[Math.floor(Math.random() * pts.length)];
        shapes.name[j]     = (px - 450) * 0.05 + (Math.random() - 0.5) * 0.12;
        shapes.name[j + 1] = -(py - 130) * 0.05 + (Math.random() - 0.5) * 0.12;
        shapes.name[j + 2] = (Math.random() - 0.5);
      }
    }
  })();

  const cDeep = new THREE.Color(0x4a0612), cRed = new THREE.Color(0xe0263f), cRose = new THREE.Color(0xffb3c1);
  for (let i = 0; i < N; i++) {
    const j = i * 3, c = new THREE.Color();
    c.copy(cDeep).lerp(cRed, Math.random());
    shapeColors.heart[j] = c.r; shapeColors.heart[j + 1] = c.g; shapeColors.heart[j + 2] = c.b;
    c.copy(cRed).lerp(cRose, Math.random() < 0.2 ? 0.8 : 0.1);
    shapeColors.name[j] = c.r; shapeColors.name[j + 1] = c.g; shapeColors.name[j + 2] = c.b;
  }

  const cur = new Float32Array(N * 3);
  const speed = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    const r = 90 + Math.random() * 60, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    cur[j] = r * Math.sin(ph) * Math.cos(th);
    cur[j + 1] = r * Math.sin(ph) * Math.sin(th);
    cur[j + 2] = r * Math.cos(ph);
    speed[i] = 0.008 + Math.random() * 0.016;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(cur), 3));
  pGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(shapeColors.heart), 3));
  const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.65, map: glow, vertexColors: true, transparent: true, opacity: 0.9,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glow, color: 0x8b0a1c, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  halo.scale.setScalar(55);
  const pGroup = new THREE.Group();
  pGroup.add(particles); pGroup.add(halo);
  scene.add(pGroup);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(34, 0.04, 8, 300),
    new THREE.MeshBasicMaterial({ color: 0xe0263f, transparent: true, opacity: 0 })
  );
  ring.rotation.x = Math.PI / 2.4;
  scene.add(ring);

  const starN = 900;
  const starPos = new Float32Array(starN * 3);
  for (let i = 0; i < starN * 3; i++) starPos[i] = (Math.random() - 0.5) * 300;
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    size: 0.5, map: glow, color: 0xff8090, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  scene.add(stars);

  let target = shapes.heart, targetCol = shapeColors.heart, showingName = false;
  function morph() {
    showingName = !showingName;
    target = showingName ? shapes.name : shapes.heart;
    targetCol = showingName ? shapeColors.name : shapeColors.heart;
  }

  let mx = 0, my = 0;
  addEventListener("mousemove", e => {
    mx = (e.clientX / innerWidth - 0.5) * 2;
    my = (e.clientY / innerHeight - 0.5) * 2;
  });

  const clock = new THREE.Clock();
  let started = false, beat = 0, introShown = false;

  // نبض محاكى على إيقاع الأغنية (الصوت بيتشغّل مباشرة من غير تحليل عشان يسمع)
  function bass1() {
    return 0.3 + 0.2 * Math.abs(Math.sin(clock.getElapsedTime() * 2.5));
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    beat += (bass1() - beat) * 0.08;

    const pos = pGeo.attributes.position.array;
    const colArr = pGeo.attributes.color.array;
    for (let i = 0; i < N; i++) {
      const j = i * 3, s = speed[i];
      cur[j]     += (target[j]     - cur[j])     * s;
      cur[j + 1] += (target[j + 1] - cur[j + 1]) * s;
      cur[j + 2] += (target[j + 2] - cur[j + 2]) * s;
      colArr[j]     += (targetCol[j]     - colArr[j])     * 0.012;
      colArr[j + 1] += (targetCol[j + 1] - colArr[j + 1]) * 0.012;
      colArr[j + 2] += (targetCol[j + 2] - colArr[j + 2]) * 0.012;
      pos[j] = cur[j]; pos[j + 1] = cur[j + 1];
      pos[j + 2] = cur[j + 2] + Math.sin(t * 0.8 + cur[j] * 0.15 + cur[j + 1] * 0.1) * 0.12;
    }
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.color.needsUpdate = true;

    pGroup.scale.setScalar(1 + Math.sin(t * 1.2) * 0.025 + beat * 0.08);
    pGroup.rotation.y = Math.sin(t * 0.15) * 0.3;
    pGroup.position.y = Math.sin(t * 0.6) * 0.8;
    ring.rotation.z = t * 0.05;
    ring.material.opacity += ((started ? 0.25 : 0) - ring.material.opacity) * 0.02;
    stars.rotation.y = t * 0.01;

    camera.position.x += ((Math.sin(t * 0.05) * 4 + mx * 4) - camera.position.x) * 0.02;
    camera.position.y += ((my * -3) - camera.position.y) * 0.02;
    camera.position.z += ((started ? 55 : 70) - camera.position.z) * 0.01;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);

    if (!introShown && t > 4) { introShown = true; $("startBtn").classList.add("show"); }
  }
  animate();

  function typeMessage(text, i = 0) {
    if (i <= text.length) {
      $("typed").textContent = text.slice(0, i);
      setTimeout(() => typeMessage(text, i + 1), 80);
    }
  }
  function countUp(el, to, ms = 3000) {
    const start = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - start) / ms);
      el.textContent = Math.floor(to * (1 - Math.pow(1 - p, 2)));
      if (p < 1) requestAnimationFrame(step);
    })(start);
  }

  $("startBtn").addEventListener("click", () => {
    if (started) return;
    started = true;
    $("music").volume = 0.8;
    $("music").play().catch(() => {});
    $("startBtn").style.opacity = 0;
    $("ui").classList.add("show");
    $("player").classList.add("show");
    countUp($("days"), Math.max(0, Math.floor((Date.now() - new Date(CONFIG.startDate)) / 86400000)));
    setTimeout(() => typeMessage(CONFIG.message), 2500);
    setInterval(morph, CONFIG.morphEvery * 1000);
    setTimeout(() => $("nextBtn").classList.add("show"), 3000);
  });

  $("playBtn1").addEventListener("click", () => {
    const m = $("music");
    if (m.paused) { m.play(); $("playBtn1").textContent = "⏸"; }
    else { m.pause(); $("playBtn1").textContent = "▶"; }
  });

  $("nextBtn").addEventListener("click", () => {
    $("music").pause();
    go("p2");
  });

  // ================== قفل التاريخ ==================
  let unlocked = false;
  function tryUnlock() {
    const d = Number($("ld").value), m = Number($("lm").value), y = Number($("ly").value);
    const U = CONFIG.unlockDate;
    if (d === U.day && m === U.month && y === U.year) {
      unlocked = true;
      $("lock").classList.add("hide");
      $("startBtn").click();   // بيشغّل الأغنية والواجهة
    } else {
      $("lockErr").textContent = "التاريخ ده مش صح، جربي تاني 💔";
      const c = $("lockCard");
      c.classList.remove("shake");
      void c.offsetWidth;
      c.classList.add("shake");
      $("ld").value = ""; $("lm").value = ""; $("ly").value = "";
      $("ld").focus();
    }
  }
  $("unlockBtn").addEventListener("click", tryUnlock);
  ["ld", "lm", "ly"].forEach(id => {
    $(id).addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
  });
  $("ld").focus();

  // ================== الصفحة 2: الكولاج ==================
  $("p2title").textContent = CONFIG.photosTitle;
  const canvasEl = $("canvas");
  const tiles = [];

  // كل صورة بتتحط في مكان مختلف بميل عشوائي
  function layoutCollage() {
    canvasEl.innerHTML = "";
    tiles.length = 0;
    const cols = innerWidth >= 900 ? 3 : 2;
    const tileW = Math.min(230, Math.max(130, innerWidth * (cols === 3 ? 0.26 : 0.38)));
    const tileH = tileW * 4 / 3 + 34;
    const colW = (innerWidth - 40) / cols;
    const rows = Math.ceil(CONFIG.photos.length / cols);
    const stepY = tileH * 0.82;
    canvasEl.style.height = (rows * stepY + tileH + 120) + "px";

    CONFIG.photos.forEach((p, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const jitterX = (Math.random() - 0.5) * (colW - tileW) * 0.7;
      const jitterY = (Math.random() - 0.5) * 30;
      const left = 20 + col * colW + (colW - tileW) / 2 + jitterX;
      const top = 20 + row * stepY + jitterY + (col % 2) * 40;
      const rot = (Math.random() * 12 - 6).toFixed(1) + "deg";

      const t = document.createElement("div");
      t.className = "tile";
      t.style.width = tileW + "px";
      t.style.left = left + "px";
      t.style.top = top + "px";
      t.style.setProperty("--r", rot);
      t.style.animationDelay = (i * 0.12) + "s";
      t.innerHTML = `
        <div class="img-wrap">
          <div class="ph">صورتك هنا</div>
          <img src="${p.src}" alt="" onerror="this.remove()">
        </div>
        <div class="label">${p.caption}</div>`;
      t.addEventListener("click", () => openLightbox(i));
      canvasEl.appendChild(t);
      tiles.push(t);
    });
  }
  addEventListener("resize", () => { if (current === "p2") layoutCollage(); });

  // ---------- اللايت بوكس بأنيميشن ----------
  const lb = $("lb"), lbCard = $("lbCard");
  let lbIndex = -1, busy = false;

  function finalRect() {
    const h = Math.min(innerHeight * 0.72, innerWidth * 0.86 * 1.25);
    const w = h * 0.8;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }
  function setCardRect(r) {
    lbCard.style.left = r.left + "px";
    lbCard.style.top = r.top + "px";
    lbCard.style.width = r.width + "px";
    lbCard.style.height = r.height + "px";
  }
  function fillCard(i) {
    const p = CONFIG.photos[i];
    $("lbImg").src = p.src;
    $("lbImg").onerror = () => { $("lbImg").removeAttribute("src"); };
    $("lbCap").textContent = p.caption;
    $("lbBack").textContent = p.back;
    lbCard.classList.remove("flipped");
  }

  async function openLightbox(i) {
    if (busy) return;
    busy = true;
    lbIndex = i;
    fillCard(i);
    const from = tiles[i].getBoundingClientRect();
    const to = finalRect();
    setCardRect(to);
    lb.classList.add("open");
    requestAnimationFrame(() => lb.classList.add("on"));
    const anim = lbCard.animate([
      { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px", opacity: 0.4, transform: "rotate(" + getComputedStyle(tiles[i]).getPropertyValue("--r") + ")" },
      { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px", opacity: 1, transform: "rotate(0deg)" }
    ], { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)" });
    await anim.finished;
    busy = false;
  }

  async function closeLightbox() {
    if (busy || lbIndex < 0) return;
    busy = true;
    const from = lbCard.getBoundingClientRect();
    const to = tiles[lbIndex].getBoundingClientRect();
    lbCard.classList.remove("flipped");
    await sleep(400);
    const anim = lbCard.animate([
      { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px", opacity: 1 },
      { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px", opacity: 0.4, transform: "rotate(" + getComputedStyle(tiles[lbIndex]).getPropertyValue("--r") + ")" }
    ], { duration: 550, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    await anim.finished;
    lb.classList.remove("on");
    await sleep(500);
    lb.classList.remove("open");
    anim.cancel();
    lbIndex = -1;
    busy = false;
  }

  async function moveTo(delta) {
    if (busy || lbIndex < 0) return;
    const n = (lbIndex + delta + CONFIG.photos.length) % CONFIG.photos.length;
    const from = lbCard.getBoundingClientRect();
    const to = tiles[lbIndex].getBoundingClientRect();
    lbCard.classList.remove("flipped");
    busy = true;
    await lbCard.animate([
      { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px", opacity: 1 },
      { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px", opacity: 0.4 }
    ], { duration: 350, easing: "ease-in", fill: "forwards" }).finished;
    lbIndex = n;
    fillCard(n);
    const nFrom = tiles[n].getBoundingClientRect();
    const nTo = finalRect();
    setCardRect(nTo);
    await lbCard.animate([
      { left: nFrom.left + "px", top: nFrom.top + "px", width: nFrom.width + "px", height: nFrom.height + "px", opacity: 0.4 },
      { left: nTo.left + "px", top: nTo.top + "px", width: nTo.width + "px", height: nTo.height + "px", opacity: 1 }
    ], { duration: 550, easing: "cubic-bezier(.2,.8,.2,1)" }).finished;
    busy = false;
  }

  lbCard.addEventListener("click", () => { if (!busy) lbCard.classList.toggle("flipped"); });
  $("lbClose").addEventListener("click", closeLightbox);
  $("lbBg").addEventListener("click", closeLightbox);
  $("lbNext").addEventListener("click", () => moveTo(1));
  $("lbPrev").addEventListener("click", () => moveTo(-1));
  addEventListener("keydown", e => {
    if (lbIndex < 0) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") moveTo(1);
    if (e.key === "ArrowRight") moveTo(-1);
  });

  // ================== الصفحة 3: الريكورد ==================
  $("voiceTitle").textContent = CONFIG.voiceTitle;
  $("voiceSub").textContent = CONFIG.voiceSub;
  $("voiceNote").textContent = CONFIG.voiceNote;

  const voice = $("voice");
  voice.src = CONFIG.voice;
  const vizCanvas = $("viz");
  const vctx = vizCanvas.getContext("2d");
  const BARS = 96;

  function resizeViz() {
    const r = vizCanvas.getBoundingClientRect();
    vizCanvas.width = r.width * devicePixelRatio;
    vizCanvas.height = r.height * devicePixelRatio;
    vctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resizeViz();
  addEventListener("resize", resizeViz);

  function drawViz(now) {
    requestAnimationFrame(drawViz);
    if (current !== "p3") return;
    const t = now / 1000;
    const w = vizCanvas.clientWidth, h = vizCanvas.clientHeight;
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.3;
    vctx.clearRect(0, 0, w, h);

    const glowG = vctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.6);
    glowG.addColorStop(0, "rgba(224,38,63,.25)");
    glowG.addColorStop(1, "rgba(224,38,63,0)");
    vctx.fillStyle = glowG;
    vctx.beginPath(); vctx.arc(cx, cy, R * 1.6, 0, Math.PI * 2); vctx.fill();

    const playing = !voice.paused;

    for (let i = 0; i < BARS; i++) {
      let v;
      if (playing) v = 0.35 + 0.35 * Math.abs(Math.sin(t * 3 + i * 0.5));
      else v = 0.12 + 0.08 * Math.sin(t * 1.5 + i * 0.4);
      const len = 6 + v * R * 0.55;
      const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      vctx.strokeStyle = `rgba(${200 + v * 55},${20 + v * 40},${50 + v * 30},${0.45 + v * 0.55})`;
      vctx.lineWidth = 3; vctx.lineCap = "round";
      vctx.beginPath();
      vctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      vctx.lineTo(cx + Math.cos(a) * (R + len), cy + Math.sin(a) * (R + len));
      vctx.stroke();
    }
  }
  requestAnimationFrame(drawViz);

  const playBtn3 = $("playBtn3");
  function syncBtn3() { playBtn3.textContent = voice.paused ? "▶" : "❚❚"; }
  voice.addEventListener("play", syncBtn3);
  voice.addEventListener("pause", syncBtn3);
  voice.addEventListener("ended", () => {
    syncBtn3();
    $("music").play().catch(() => {});   // الأغنية ترجع تكمل بعد الريكورد
    $("playBtn1").textContent = "⏸";
  });

  playBtn3.addEventListener("click", () => {
    if (voice.paused) voice.play().catch(() => {});
    else voice.pause();
  });

  let voiceStarted = false;
  async function onEnterVoice() {
    if (voiceStarted) { syncBtn3(); return; }   // أول مرة بس بيشتغل لوحده
    voiceStarted = true;
    try {
      await voice.play();
      $("tap").classList.remove("show");
    } catch (e) {
      $("tap").classList.add("show");
    }
    syncBtn3();
  }
  $("tap").addEventListener("click", () => {
    $("tap").classList.remove("show");
    voice.play().catch(() => {});
  });

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, "0")}`;
  }
  voice.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(voice.duration); });
  voice.addEventListener("timeupdate", () => {
    $("cur").textContent = fmt(voice.currentTime);
    $("fill").style.width = (voice.duration ? (voice.currentTime / voice.duration) * 100 : 0) + "%";
  });
  $("bar").addEventListener("click", e => {
    if (!voice.duration) return;
    const r = $("bar").getBoundingClientRect();
    voice.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * voice.duration;
  });

  // ================== الصفحة 4: الرسالة ==================
  function startLetter() {
    const body = $("letterBody");
    body.innerHTML = "";
    $("letterTitle").textContent = CONFIG.letterTitle;
    CONFIG.letter.forEach((line, i) => {
      const p = document.createElement("p");
      p.className = "ln";
      p.textContent = line;
      p.style.animationDelay = (0.4 + i * 0.9) + "s";
      body.appendChild(p);
    });
    const s = document.createElement("p");
    s.className = "sign";
    s.textContent = CONFIG.letterSign;
    s.style.animationDelay = (0.6 + CONFIG.letter.length * 0.9) + "s";
    body.appendChild(s);
  }

  // قلوب بتطلع في الخلفية (في الصفحات 2 و3)
  setInterval(() => {
    if (current === "p1") return;
    const h = document.createElement("div");
    h.className = "float-heart";
    h.textContent = "❤";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (12 + Math.random() * 18) + "px";
    const dur = 8 + Math.random() * 6;
    h.style.animationDuration = dur + "s";
    $(current).appendChild(h);
    setTimeout(() => h.remove(), dur * 1000);
  }, 1000);
</script>

</body>
</html>
